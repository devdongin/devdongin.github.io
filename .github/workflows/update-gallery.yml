# 갤러리 자동 반영 — gallery/ 폴더에 미디어를 넣고 push하면 페이지가 갱신된다.
# (gallery.html 자체를 커밋하므로 트리거는 gallery/** 로 한정해 재귀 실행을 막는다)
name: update-gallery

on:
  push:
    branches: [main]
    paths: ["gallery/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  # 두 워크플로 모두 main 에 자동 커밋·push 하므로 같은 group 으로 묶는다.
  # 서로 다른 group 이면 동시 실행 시 non-fast-forward 로 한쪽이 실패한다.
  group: main-writer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render gallery page
        run: python scripts/render_gallery.py

      - name: Commit & push (PR 경유)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name devdongin
          git config user.email devdongin@users.noreply.github.com
          git add gallery.html
          if git diff --cached --quiet; then
            echo "no changes, skipping commit"
            exit 0
          fi
          # main Ruleset이 직접 push를 막으므로 작업 브랜치 → PR → 자동 병합으로 반영한다.
          # (Ruleset은 기본 브랜치에만 걸려 있어 작업 브랜치 push·삭제는 자유롭다)
          BRANCH="auto/gallery-$GITHUB_RUN_ID"
          git checkout -b "$BRANCH"
          git commit -m "chore: 갤러리 자동 반영"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: 갤러리 자동 반영" \
            --body "자동 갱신 워크플로가 생성한 PR입니다. run: $GITHUB_RUN_ID" > /tmp/pr_url.txt
          cat /tmp/pr_url.txt
          # mergeable 상태 계산에 잠깐 걸리므로 몇 번 재시도한다
          for i in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then exit 0; fi
            echo "merge not ready, retrying ($i)"
            sleep 10
          done
          echo "::error::자동 생성 PR 병합에 실패했습니다. 수동 확인이 필요합니다: $(cat /tmp/pr_url.txt)" >&2
          exit 1
