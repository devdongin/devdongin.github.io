# 갤러리 자동 반영: gallery/ 폴더에 미디어를 넣고 push하면 페이지가 갱신된다.
# (gallery.html 자체를 커밋하므로 트리거는 gallery/** 로 한정해 재귀 실행을 막는다)
name: update-gallery

on:
  push:
    branches: [main]
    paths: ["gallery/**"]
  workflow_dispatch:

concurrency:
  # 두 워크플로 모두 main 에 자동 커밋·push 하므로 같은 group 으로 묶는다.
  # 서로 다른 group 이면 동시 실행 시 non-fast-forward 로 한쪽이 실패한다.
  group: main-writer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # 권한은 job 스코프로만 준다 (#138 P1).
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 가변 태그 대신 커밋 SHA 로 고정한다 (#138 P1). update-stats.yml 과 같은 버전.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Render gallery page
        run: python scripts/render_gallery.py

      # 승인 0건 자동 병합이라 사람 리뷰가 없다 — 기계적으로 확인 가능한 것은 여기서 막는다 (#27)
      - name: Verify before publishing
        id: verify
        run: |
          # pipefail 없이 | tee 를 쓰면 파이프라인 exit code 가 tee(항상 0)의 것이 되어
          # 검증 실패가 그대로 통과한다 — 실제로 run 30682489009 에서 그렇게 새어나갔다.
          set -o pipefail
          git fetch -q origin main
          python scripts/verify_auto_update.py origin/main 2>&1 | tee /tmp/verify.txt

      - name: Commit & push (PR 경유)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name devdongin
          git config user.email devdongin@users.noreply.github.com
          git add gallery.html
          if git diff --cached --quiet; then
            echo "no changes, skipping commit"
            exit 0
          fi
          # main Ruleset이 직접 push를 막으므로 작업 브랜치 → PR → 자동 병합으로 반영한다.
          # (Ruleset은 기본 브랜치에만 걸려 있어 작업 브랜치 push·삭제는 자유롭다)
          BRANCH="auto/gallery-$GITHUB_RUN_ID"
          git checkout -b "$BRANCH"
          git commit -m "chore: 갤러리 자동 반영"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: 갤러리 자동 반영" \
            --body "$(printf '자동 갱신 워크플로가 생성한 PR입니다. run: %s\n\n## 게시 전 검증\n\n```\n%s\n```\n\n## 변경 요약\n\n```\n%s\n```\n' "$GITHUB_RUN_ID" "$(cat /tmp/verify.txt)" "$(git diff --stat origin/main -- | tail -20)")" > /tmp/pr_url.txt
          cat /tmp/pr_url.txt
          # mergeable 상태 계산에 잠깐 걸리므로 몇 번 재시도한다
          for i in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then exit 0; fi
            echo "merge not ready, retrying ($i)"
            sleep 10
          done
          echo "::error::자동 생성 PR 병합에 실패했습니다. 수동 확인이 필요합니다: $(cat /tmp/pr_url.txt)" >&2
          exit 1
