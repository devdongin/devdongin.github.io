# 갤러리 자동 반영 — gallery/ 폴더에 미디어를 넣고 push하면 페이지가 갱신된다.
# (gallery.html 자체를 커밋하므로 트리거는 gallery/** 로 한정해 재귀 실행을 막는다)
name: update-gallery

on:
  push:
    branches: [main]
    paths: ["gallery/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 두 워크플로 모두 main 에 자동 커밋·push 하므로 같은 group 으로 묶는다.
  # 서로 다른 group 이면 동시 실행 시 non-fast-forward 로 한쪽이 실패한다.
  group: main-writer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render gallery page
        run: python scripts/render_gallery.py

      - name: Commit & push
        run: |
          git config user.name devdongin
          git config user.email devdongin@users.noreply.github.com
          git add gallery.html
          if git diff --cached --quiet; then
            echo "no changes, skipping commit"
            exit 0
          fi
          git commit -m "chore: 갤러리 자동 반영"
          # 다른 writer 워크플로가 먼저 push 했을 수 있으므로 rebase 후 재시도한다.
          # (concurrency group 으로 대부분 막히지만, 수동 push 와 겹치는 경우가 남는다)
          for i in 1 2 3; do
            if err=$(git push 2>&1); then exit 0; fi
            echo "$err"
            # Ruleset(PR 필수) 거부는 재시도로 풀리지 않는다 — 즉시 원인을 남기고 중단한다.
            case "$err" in
              *GH013*|*"protected branch"*|*"must be made through a pull request"*)
                echo "::error::main Ruleset이 push를 차단했습니다. 재시도로는 해결되지 않습니다 — GitHub Actions 앱을 Ruleset bypass에 추가하거나 PR 기반 갱신으로 전환하세요." >&2
                exit 1 ;;
            esac
            echo "push rejected (non-fast-forward로 추정), rebase 후 재시도 ($i)"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::push가 3회 재시도 후에도 실패했습니다." >&2
          exit 1
