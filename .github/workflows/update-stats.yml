# 자동 갱신 — 커밋 집계(매일) + AI REVIEW(3시간마다)
#
# 필요한 repo secrets:
#   STATS_TOKEN             회사 계정 PAT (대상 저장소 읽기 권한)
#   STATS_CONFIG            집계 설정 JSON — scripts/collect_stats.py docstring 참고.
#                           내부 저장소명이 포함되므로 반드시 secret으로만 관리한다.
#   CLAUDE_CODE_OAUTH_TOKEN Claude 구독(Pro/Max) OAuth 토큰 — `claude setup-token`으로 발급.
#                           API 별도 과금 없이 플랜 사용량에서 차감된다.
name: update-stats

on:
  schedule:
    - cron: "30 15 * * *" # 00:30 KST 시도 — 누락돼도 아래 3시간 크론이 대신 채운다
    - cron: "0 */3 * * *" # 3시간마다 — AI REVIEW 재작성
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # claude-code-action OIDC 요구사항

concurrency:
  # 두 워크플로 모두 main 에 자동 커밋·push 하므로 같은 group 으로 묶는다.
  # 서로 다른 group 이면 동시 실행 시 non-fast-forward 로 한쪽이 실패한다.
  group: main-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 특정 크론 슬롯에 통계 갱신을 묶으면 GitHub이 그 실행을 흘렸을 때
      # 하루치가 통째로 비어버린다(실제로 15:30 UTC 실행이 반복 누락됐다).
      # 대신 stats.json의 수집일이 오늘(KST)이 아니면 갱신하도록 해서,
      # 그날 처음 살아남은 실행이 알아서 채우게 한다.
      - name: Check stats freshness
        id: freshness
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          COLLECTED=$(python -c "import json;print(json.load(open('data/stats.json'))['collected_at'])" 2>/dev/null || echo none)
          echo "collected=$COLLECTED today=$TODAY"
          if [ "$COLLECTED" = "$TODAY" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect commit stats
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.stale == 'true'
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_CONFIG: ${{ secrets.STATS_CONFIG }}
        run: python scripts/collect_stats.py

      - name: Collect blog posts (RSS)
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.stale == 'true'
        run: python scripts/collect_blog.py

      - name: Render stats into index.html
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.stale == 'true'
        run: python scripts/render_stats.py

      - name: Set KST timestamp
        run: echo "NOW_KST=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"

      - name: Regenerate AI review (Claude, subscription OAuth)
        # 3시간 크론·수동 실행, 그리고 통계가 새로 수집된 실행에서 재작성
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */3 * * *' || steps.freshness.outputs.stale == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }} # GitHub App 설치 없이 워크플로 토큰 사용
          claude_args: '--allowedTools "Read,Edit"'
          prompt: |
            data/stats.json(최신 커밋 집계)과 index.html, CLAUDE.md를 읽고,
            index.html에서 <!-- AI-REVIEW:START --> 와 <!-- AI-REVIEW:END --> 사이의
            평가 문단만 다시 작성하라.

            규칙:
            - CLAUDE.md의 절대 규칙을 지킨다: 민감정보 금지, 이름은 "선동인",
              사실에 없는 수치·경력 창작 금지.
            - 포지셔닝(v3): "AI 모델을 C++ 추론 SDK와 클라이언트 소프트웨어에 통합하고,
              실시간 최적화부터 OS 연동·배포·운영 장애까지 해결해본 개발자"로 평가한다.
              SEEUON 제품 기능이나 사업 성과를 홍보하지 말고, 문제 정의·기술 선택·구현 범위·
              검증 결과를 주어로 쓴다. 커널 드라이버·Credential Provider·후킹/인젝션은
              AI 클라이언트를 실제 환경에 통합하며 확장한 시스템 역량으로 서술한다.
            - 분량: 데스크톱 기준 3~4줄. 핵심 평가 1문장에 검증 가능한 근거
              2~3문장을 이어 쓰며, 한 문장 요약으로 축소하지 않는다. 모바일에서는
              화면 폭에 따라 줄 수가 늘어날 수 있다.
            - 구조: <p><strong>첫 문장 핵심 평가.</strong> 이어서 근거 2~3문장 —
              집계 범위, 대표 저장소 기여율, 성능 수치 중 강한 것만 압축 인용한다.
              <span class="ai-meta">이 평가는 AI(Claude)가 저장소 기여 데이터를 근거로
              3시간마다 자동 생성·갱신합니다 · 최근 갱신 ${{ env.NOW_KST }} KST</span></p>
            - 추론 파이프라인 모델 구성은 반드시 "모델 5종 + 특징점 추출"로 표기한다
              (사람·카메라 탐지 + liveness 3종. "모델 3종/4종" 표기는 오기).
            - 평가 근거는 data/stats.json의 실제 수치(총 커밋 수, 기여 통계)와
              index.html에 이미 공개된 사실만 사용한다. 내부 저장소명은 절대 쓰지 않는다.
            - 최근 활동량(월별 추이)이 눈에 띄게 변했다면 그것을 반영해도 좋다.
            - 마커 밖의 내용은 절대 수정하지 않는다.

      - name: Commit & push
        run: |
          git config user.name devdongin
          git config user.email devdongin@users.noreply.github.com
          git add index.html data/
          if git diff --cached --quiet; then
            echo "no changes, skipping commit"
            exit 0
          fi
          git commit -m "chore: 자동 갱신 — 커밋 통계 / AI REVIEW"
          # 다른 writer 워크플로가 먼저 push 했을 수 있으므로 rebase 후 재시도한다.
          # (concurrency group 으로 대부분 막히지만, 수동 push 와 겹치는 경우가 남는다)
          for i in 1 2 3; do
            if err=$(git push 2>&1); then exit 0; fi
            echo "$err"
            # Ruleset(PR 필수) 거부는 재시도로 풀리지 않는다 — 즉시 원인을 남기고 중단한다.
            case "$err" in
              *GH013*|*"protected branch"*|*"must be made through a pull request"*)
                echo "::error::main Ruleset이 push를 차단했습니다. 재시도로는 해결되지 않습니다 — GitHub Actions 앱을 Ruleset bypass에 추가하거나 PR 기반 갱신으로 전환하세요." >&2
                exit 1 ;;
            esac
            echo "push rejected (non-fast-forward로 추정), rebase 후 재시도 ($i)"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::push가 3회 재시도 후에도 실패했습니다." >&2
          exit 1
