# 자동 갱신 — 커밋 집계(매일) + AI REVIEW(3시간마다)
#
# 필요한 repo secrets:
#   STATS_TOKEN             회사 계정 PAT (대상 저장소 읽기 권한)
#   STATS_CONFIG            집계 설정 JSON — scripts/collect_stats.py docstring 참고.
#                           내부 저장소명이 포함되므로 반드시 secret으로만 관리한다.
#   CLAUDE_CODE_OAUTH_TOKEN Claude 구독(Pro/Max) OAuth 토큰 — `claude setup-token`으로 발급.
#                           API 별도 과금 없이 플랜 사용량에서 차감된다.
name: update-stats

on:
  schedule:
    - cron: "30 15 * * *" # 00:30 KST 시도 — 누락돼도 아래 3시간 크론이 대신 채운다
    - cron: "0 */3 * * *" # 3시간마다 — AI REVIEW 재작성
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # 실패 시 Issue 자동 등록
  id-token: write # claude-code-action OIDC 요구사항

concurrency:
  # 두 워크플로 모두 main 에 자동 커밋·push 하므로 같은 group 으로 묶는다.
  # 서로 다른 group 이면 동시 실행 시 non-fast-forward 로 한쪽이 실패한다.
  group: main-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 특정 크론 슬롯에 통계 갱신을 묶으면 GitHub이 그 실행을 흘렸을 때
      # 하루치가 통째로 비어버린다(실제로 15:30 UTC 실행이 반복 누락됐다).
      # 대신 stats.json의 수집일이 오늘(KST)이 아니면 갱신하도록 해서,
      # 그날 처음 살아남은 실행이 알아서 채우게 한다.
      - name: Check stats freshness
        id: freshness
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          COLLECTED=$(python -c "import json;print(json.load(open('data/stats.json',encoding='utf-8'))['collected_at'])" 2>/dev/null || echo none)
          echo "collected=$COLLECTED today=$TODAY"
          if [ "$COLLECTED" = "$TODAY" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect commit stats
        id: collect
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.stale == 'true'
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_CONFIG: ${{ secrets.STATS_CONFIG }}
        run: python scripts/collect_stats.py

      # 블로그는 통계와 분리해 자체 주기로 돈다.
      # 예전에는 통계 신선도(stale)에 묶여 있어, 통계 수집이 건너뛰거나 실패하면
      # 블로그도 함께 멈췄다. AI REVIEW 의 관심사 문장이 blog.json 하나에
      # 의존하게 된 뒤로는 그 정지가 곧 평가문 정체로 이어진다.
      - name: Check blog freshness
        id: blogfresh
        env:
          MAX_AGE_DAYS: "1" # 하루. 이틀로 늘리려면 2 로 바꾼다
        run: |
          COLLECTED=$(python -c "import json;print(json.load(open('data/blog.json',encoding='utf-8')).get('collected_at',''))" 2>/dev/null || echo "")
          if [ -z "$COLLECTED" ]; then
            echo "collected_at 없음(최초 도입 등) -> 갱신"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV=$(date -d "$COLLECTED" +%s 2>/dev/null || echo 0)
          AGE=$(( ( $(date +%s) - PREV ) / 86400 ))
          echo "collected=$COLLECTED age=${AGE}d max=${MAX_AGE_DAYS}d"
          if [ "$AGE" -ge "$MAX_AGE_DAYS" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect blog posts (RSS)
        if: github.event_name == 'workflow_dispatch' || steps.blogfresh.outputs.stale == 'true'
        run: python scripts/collect_blog.py

      - name: Render stats into index.html
        id: render
        # 블로그만 갱신된 날에도 BLOG-CARDS 마커를 다시 그려야 한다
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.stale == 'true' || steps.blogfresh.outputs.stale == 'true'
        run: python scripts/render_stats.py

      - name: Set KST timestamp
        run: echo "NOW_KST=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"

      - name: Regenerate AI review (Claude, subscription OAuth)
        id: review
        # 3시간 크론·수동 실행, 그리고 통계가 새로 수집된 실행에서 재작성
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */3 * * *' || steps.freshness.outputs.stale == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }} # GitHub App 설치 없이 워크플로 토큰 사용
          claude_args: '--allowedTools "Read,Edit"'
          prompt: |
            data/stats.json(날짜별 커밋 수), data/blog.json(블로그 최신 글),
            index.html, CLAUDE.md를 읽고,
            index.html에서 <!-- AI-REVIEW:START --> 와 <!-- AI-REVIEW:END --> 사이의
            평가 문단만 다시 작성하라.

            무엇을 쓰는가:
            - 앞 3~4문장: 선동인이 "일하는 방식"에 대한 관찰. 이력 나열이 아니라
              저장소에 남은 행동 증거에서 읽어낸 패턴을 쓴다.
              쓸 수 있는 증거: CLAUDE.md 에 본인이 적어둔 규칙들, 자동 갱신 파이프라인과
              검증 게이트(verify_auto_update.py)의 존재와 그 안의 가드, 마커 기반 렌더링,
              index.html 의 딥다이브 서술 방식, 커밋 분포.
              구체적이고 그 사람에게만 해당되는 관찰이어야 한다.
              (좋은 예: 반복 작업을 절차로 굳히고 그 절차를 검증으로 막아두는 습관,
               수치를 근거와 함께만 쓰는 태도, 실패를 조용히 넘기지 않게 만드는 설계)
              범용 성격 진단 문구는 쓰지 않는다.
            - 마지막 1문장: "요즘/오늘 무엇에 관심이 있어 보이는가".
              근거는 data/blog.json 의 최신 글 제목·카테고리·날짜뿐이다.
              커밋 수는 활동량일 뿐 주제가 아니므로 관심사의 근거로 쓰지 않는다.
              최신 글 날짜가 오늘이나 최근이면 그 주제를 우선 인용한다.
              근거가 없으면 이 문장을 생략한다.

            규칙:
            - CLAUDE.md의 절대 규칙을 지킨다: 민감정보 금지, 이름은 "선동인",
              사실에 없는 수치·경력 창작 금지, 엠 대시 금지.
            - 고객사 실명, 내부 저장소명·조직명, 회사 계정 ID는 절대 쓰지 않는다.
            - 커밋 "수"에서 업무 종류나 생산성을 추론하지 않는다.
              업무 종류와 관심 주제는 blog.json 에 적힌 것만 쓴다. (#27)
            - 추론 파이프라인 모델 구성을 언급한다면 반드시 "모델 5종 + 특징점 추출"
              (사람·카메라 탐지 + liveness 3종. "모델 3종/4종"은 오기).
            - 어조: 날카롭고 구체적이되 채용 담당자가 읽는 글이다.
              비꼬거나 스스로를 깎는 표현, 밈 문구는 쓰지 않는다.
            - 분량: 데스크톱 기준 4~5줄. 한 문장 요약으로 축소하지 않는다.
            - 매 실행마다 같은 문장이 나오지 않게, 그날 가장 최신인 신호
              (blog.json 최신 글, 최근 커밋 분포)를 먼저 인용한다.

            구조(이 형태를 유지한다):
            <p><strong>첫 문장.</strong> 이어서 관찰 2~3문장. 마지막에 관심사 1문장.
            <span class="ai-meta">이 평가는 AI(Claude)가 저장소 기여 데이터를 근거로
            3시간마다 자동 생성·갱신합니다 · 최근 갱신 ${{ env.NOW_KST }} KST</span></p>

            마커 밖의 내용은 절대 수정하지 않는다.

      # 승인 0건 자동 병합이라 사람 리뷰가 없다 — 기계적으로 확인 가능한 것은 여기서 막는다 (#27)
      - name: Verify before publishing
        id: verify
        run: |
          # pipefail 없이 | tee 를 쓰면 파이프라인 exit code 가 tee(항상 0)의 것이 되어
          # 검증 실패가 그대로 통과한다 — 실제로 run 30682489009 에서 그렇게 새어나갔다.
          set -o pipefail
          git fetch -q origin main
          python scripts/verify_auto_update.py origin/main 2>&1 | tee /tmp/verify.txt

      - name: Commit & push (PR 경유)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name devdongin
          git config user.email devdongin@users.noreply.github.com
          git add index.html data/
          if git diff --cached --quiet; then
            echo "no changes, skipping commit"
            exit 0
          fi
          # main Ruleset이 직접 push를 막으므로 작업 브랜치 → PR → 자동 병합으로 반영한다.
          # (Ruleset은 기본 브랜치에만 걸려 있어 작업 브랜치 push·삭제는 자유롭다)
          BRANCH="auto/stats-$GITHUB_RUN_ID"
          git checkout -b "$BRANCH"
          git commit -m "chore: 자동 갱신: 커밋 통계 / AI REVIEW"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: 자동 갱신: 커밋 통계 / AI REVIEW" \
            --body "$(printf '자동 갱신 워크플로가 생성한 PR입니다. run: %s\n\n## 게시 전 검증\n\n```\n%s\n```\n\n## 변경 요약\n\n```\n%s\n```\n' "$GITHUB_RUN_ID" "$(cat /tmp/verify.txt)" "$(git diff --stat origin/main -- | tail -20)")" > /tmp/pr_url.txt
          cat /tmp/pr_url.txt
          # mergeable 상태 계산에 잠깐 걸리므로 몇 번 재시도한다
          for i in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then exit 0; fi
            echo "merge not ready, retrying ($i)"
            sleep 10
          done
          echo "::error::자동 생성 PR 병합에 실패했습니다. 수동 확인이 필요합니다: $(cat /tmp/pr_url.txt)" >&2
          exit 1

      # 승인 0건 자동 병합이라 사람이 실패를 알아챌 경로가 없다.
      # 실제로 STATS_CONFIG 오류로 통계가 92% 빠진 채 며칠 게시됐다.
      # 실패하면 Issue 로 알리고, 다음 성공 실행에서 자동으로 닫는다.
      - name: Report failure as Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUT_COLLECT: ${{ steps.collect.outcome }}
          OUT_RENDER: ${{ steps.render.outcome }}
          OUT_REVIEW: ${{ steps.review.outcome }}
          OUT_VERIFY: ${{ steps.verify.outcome }}
        run: |
          TITLE_PREFIX='[자동 갱신 실패]'
          VERIFY_OUT=$(cat /tmp/verify.txt 2>/dev/null || echo '(verify 단계 전에 실패해 출력 없음)')

          {
            echo "실행: $RUN_URL"
            echo
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| Collect commit stats | ${OUT_COLLECT:-skipped} |"
            echo "| Render stats | ${OUT_RENDER:-skipped} |"
            echo "| AI review | ${OUT_REVIEW:-skipped} |"
            echo "| Verify | ${OUT_VERIFY:-skipped} |"
            echo
            echo '<details><summary>검증 출력</summary>'
            echo
            echo '```'
            echo "$VERIFY_OUT"
            echo '```'
            echo
            echo '</details>'
          } > /tmp/issue_body.md

          # 3시간마다 도는 워크플로라 매번 새 Issue 를 만들면 하루 8개가 쌓인다.
          # 열려 있는 같은 제목의 Issue 가 있으면 코멘트만 붙인다.
          EXISTING=$(gh issue list --state open --limit 1 \
            --search "$TITLE_PREFIX in:title" --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "기존 Issue #$EXISTING 에 코멘트"
            gh issue comment "$EXISTING" --body-file /tmp/issue_body.md
          else
            gh issue create \
              --title "$TITLE_PREFIX $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST" \
              --body-file /tmp/issue_body.md
          fi

      - name: Close failure Issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 복구됐는데 Issue 가 열린 채면 알림 자체를 믿을 수 없게 된다
          for n in $(gh issue list --state open --limit 20 \
              --search '[자동 갱신 실패] in:title' --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue close "$n" --comment "자동 갱신이 정상 실행되어 닫습니다. 실행: $RUN_URL"
          done
