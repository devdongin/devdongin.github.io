<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러리 | 선동인</title>
<meta name="description" content="선동인의 대외 활동 갤러리 — 해커톤, 데모, 현장 기록">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://devdongin.github.io/gallery.html">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #9ba7b4;
    --accent: #58a6ff;
    --accent-dim: rgba(88,166,255,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(13,17,23,0.85); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: 1100px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 700; }
  .brand img { width: 32px; height: 32px; border-radius: 50%; }
  .back { color: var(--text-dim); text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 8px; }
  .back:hover { color: var(--text); background: var(--accent-dim); }
  header { max-width: 1100px; margin: 0 auto; padding: 72px 24px 8px; text-align: center; }
  .kicker { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  header h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; margin-top: 8px; }
  header p { color: var(--text-dim); margin-top: 12px; font-size: 15px; }
  .grid {
    max-width: 1100px; margin: 0 auto; padding: 40px 24px 96px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px; align-items: start;
  }
  .g-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    transition: border-color .2s ease, transform .2s ease;
  }
  .g-card:hover { border-color: var(--accent); transform: translateY(-3px); }
  .g-card img, .g-card video { display: block; width: 100%; height: auto; }
  .g-card a { display: block; line-height: 0; }
  .g-card figcaption { padding: 12px 16px; font-size: 14px; color: var(--text-dim); }
  footer { border-top: 1px solid var(--border); padding: 28px 24px; text-align: center; color: var(--text-dim); font-size: 13px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="brand" href="./">
      <img src="avatar-nav.webp" alt="" width="32" height="32">
      devdongin
    </a>
    <a class="back" href="./">← 홈으로</a>
  </div>
</nav>

<header>
  <p class="kicker">Gallery</p>
  <h1>대외 활동 &amp; 기록</h1>
  <p>해커톤, 데모, 현장의 순간들</p>
</header>

<div class="grid">
  <!-- GALLERY:START -->
  <figure class="g-card"><a href="gallery/%ED%95%B4%EC%BB%A4%ED%86%A4-3.webp" target="_blank" rel="noopener"><img src="gallery/%ED%95%B4%EC%BB%A4%ED%86%A4-3.webp" alt="해커톤 3" loading="lazy"></a><figcaption>해커톤 3</figcaption></figure>
  <figure class="g-card"><a href="gallery/%ED%95%B4%EC%BB%A4%ED%86%A4-2.webp" target="_blank" rel="noopener"><img src="gallery/%ED%95%B4%EC%BB%A4%ED%86%A4-2.webp" alt="해커톤 2" loading="lazy"></a><figcaption>해커톤 2</figcaption></figure>
  <figure class="g-card"><a href="gallery/%ED%95%B4%EC%BB%A4%ED%86%A4-1.webp" target="_blank" rel="noopener"><img src="gallery/%ED%95%B4%EC%BB%A4%ED%86%A4-1.webp" alt="해커톤 1" loading="lazy"></a><figcaption>해커톤 1</figcaption></figure>
  <figure class="g-card"><video controls preload="metadata" playsinline><source src="gallery/liveness-%EB%8D%B0%EB%AA%A8.mp4" type="video/mp4"></video><figcaption>liveness 데모</figcaption></figure>
  <!-- GALLERY:END -->
</div>

<footer>
  <p>© 2026 선동인 (devdongin) · <a href="./">devdongin.github.io</a></p>
</footer>

</body>
</html>
